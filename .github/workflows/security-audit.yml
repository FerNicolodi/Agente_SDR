# M3 — Monitoramento de dependências (pip-audit)
#
# Executa em todo push e PR para main.
# Bloqueia merge se encontrar CVE de severidade CRITICAL ou HIGH.
# Relatório completo disponível como artefato por 30 dias.

name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main]
  schedule:
    # Roda toda segunda-feira às 08:00 UTC para capturar CVEs novos
    # mesmo sem alteração no requirements.txt
    - cron: "0 8 * * 1"

jobs:
  pip-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Run pip-audit
        id: audit
        run: |
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit-report.json \
            --severity high \
            --no-deps
        # --severity high: falha apenas em HIGH e CRITICAL (ignora LOW/MEDIUM)
        # --no-deps: audita só o que está explicitamente no requirements.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      - name: Summary on failure
        if: failure()
        run: |
          echo "## ⚠️ Vulnerabilidades encontradas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O scan de dependências detectou CVEs de severidade HIGH ou CRITICAL." >> $GITHUB_STEP_SUMMARY
          echo "Baixe o artefato \`pip-audit-report\` para ver o relatório completo." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ação necessária:** atualizar a(s) dependência(s) afetada(s) em \`requirements.txt\`." >> $GITHUB_STEP_SUMMARY
          pip-audit --requirement requirements.txt --format columns --severity high --no-deps || true

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: pip-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Run tests
        # Env vars atualizadas na revisão de segurança de 2026-07-27: o
        # workflow ainda listava variáveis do Meta Cloud API (integração
        # trocada por Z-API no commit 744f840) e não tinha as que
        # _validate_secrets() (src/main.py) de fato exige hoje. Antes disso
        # passava por acidente — os testes de kill switch não disparavam o
        # lifespan (TestClient sem `with`); corrigido junto nesta revisão.
        env:
          ANTHROPIC_API_KEY: fake
          ZAPI_INSTANCE_ID: fake
          ZAPI_TOKEN: fake
          ZAPI_CLIENT_TOKEN: fake
          HUBSPOT_API_KEY: fake
          HUBSPOT_WORKFLOW_HMAC_SECRET: fake
          SLACK_BOT_TOKEN: fake
          SLACK_CLOSER_CHANNEL: fake
          SITE_FORM_HMAC_SECRET: fake
          SECURITY_LOG_FILE: ""
        run: python -m pytest tests/ -v --tb=short
