  <text x="748" y="332" text-anchor="middle" font-size="10" fill="#92400e">scoring/ · config/scoring_weights.yaml</text>

  <rect x="630" y="342" width="236" height="44" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="748" y="358" text-anchor="middle" font-size="9" fill="#78350f">B (porte) · A (cargo) · N1 (setor) · N2 (dor)</text>
  <text x="748" y="371" text-anchor="middle" font-size="9" fill="#78350f">N3 (tecnografia) · T (timeline) · Bônus</text>
  <text x="748" y="381" text-anchor="middle" font-size="9" font-style="italic" fill="#b45309">LLM nunca escreve score</text>

  <rect x="630" y="394" width="112" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="686" y="409" text-anchor="middle" font-size="9" font-weight="600" fill="#4c1d95">AI First Receptiveness</text>
  <text x="686" y="422" text-anchor="middle" font-size="9" fill="#5b21b6">alta / media / baixa</text>

  <rect x="750" y="394" width="116" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="808" y="409" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">Disqualifiers D1–D7</text>
  <text x="808" y="422" text-anchor="middle" font-size="9" fill="#991b1b">check automático M5</text>

  <line x1="370" y1="326" x2="617" y2="350" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

