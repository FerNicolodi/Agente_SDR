  <text x="257" y="558" text-anchor="middle" font-size="9" fill="#64748b">WARM (24h SLA)</text>

  <rect x="340" y="502" width="140" height="62" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
