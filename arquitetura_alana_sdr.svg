  <rect x="424" y="292" width="140" height="28" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="494" y="307" text-anchor="middle" font-size="10" font-weight="600" fill="#4c1d95">AGUARDANDO</text>
  <text x="494" y="318" text-anchor="middle" font-size="9" fill="#5b21b6">_HORARIO</text>

  <line x1="494" y1="144" x2="494" y2="151" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="494" y1="178" x2="494" y2="185" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)"/>
