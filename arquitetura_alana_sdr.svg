  <text x="565" y="558" text-anchor="middle" font-size="9" fill="#5b21b6">QA Responder</text>

  <rect x="650" y="502" width="140" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="720" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Closer (humano)</text>
