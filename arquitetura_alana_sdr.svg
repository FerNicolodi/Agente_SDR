  <text x="450" y="46" text-anchor="middle" font-size="11" fill="#94a3b8">DB1 Global Software · Qualificação inbound via WhatsApp</text>

  <!-- COLUNA 1 — ENTRADA -->
  <rect x="20" y="70" width="120" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Lead</text>
  <text x="80" y="105" text-anchor="middle" font-size="10" fill="#64748b">Formulário site</text>
  <text x="80" y="116" text-anchor="middle" font-size="10" fill="#64748b">DGS / DB1</text>

  <rect x="20" y="160" width="120" height="52" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="80" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">WhatsApp</text>
  <text x="80" y="194" text-anchor="middle" font-size="10" fill="#166534">Meta Cloud API</text>
  <text x="80" y="206" text-anchor="middle" font-size="10" fill="#166534">Template M1 · Webhooks</text>

  <line x1="80" y1="122" x2="80" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="88" y="143" font-size="9" fill="#94a3b8">form submit</text>

  <!-- COLUNA 2 — ORQUESTRADOR -->
