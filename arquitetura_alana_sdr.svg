  <text x="275" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">FastAPI · Orquestrador</text>
  <text x="275" y="106" text-anchor="middle" font-size="10" fill="#94a3b8">routes/whatsapp.py</text>

  <rect x="194" y="118" width="162" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="275" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">1. Verificar assinatura</text>
  <text x="275" y="146" text-anchor="middle" font-size="9" fill="#64748b">HMAC Meta · rate limit</text>

  <rect x="194" y="162" width="162" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="275" y="177" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">2. Recuperar estado</text>
  <text x="275" y="190" text-anchor="middle" font-size="9" fill="#64748b">HubSpot · av_current_step</text>

  <rect x="194" y="206" width="162" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="275" y="221" text-anchor="middle" font-size="10" font-weight="600" fill="#4c1d95">3. Extrair sinal (LLM)</text>
  <text x="275" y="234" text-anchor="middle" font-size="9" fill="#5b21b6">enum fechado · tool-calling</text>

