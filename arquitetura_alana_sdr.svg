<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>Arquitetura — Agente SDR Alana</title>
  <desc>Diagrama de arquitetura da solução Alana SDR: entrada via formulário do site, orquestração FastAPI, máquina de estados M1-M6, LLM, scoring BANT e integrações externas.</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
