  <text x="200" y="290" font-size="9" fill="#64748b">  · Injeção → escalonamento</text>
  <text x="200" y="301" font-size="9" fill="#64748b">  · QA responder (escopo)</text>

  <rect x="194" y="312" width="162" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="275" y="327" text-anchor="middle" font-size="10" font-weight="600" fill="#78350f">5. Scoring BANT</text>
  <text x="275" y="340" text-anchor="middle" font-size="9" fill="#92400e">rules.py · disqualifiers.py</text>

  <rect x="194" y="356" width="162" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="275" y="371" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">6. Gerar mensagem</text>
  <text x="275" y="384" text-anchor="middle" font-size="9" fill="#64748b">message_composer (M3-M5)</text>

  <rect x="194" y="400" width="162" height="36" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
