  <!-- LEGENDA -->
  <rect x="30" y="590" width="840" height="116" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="608" font-size="10" font-weight="700" fill="#64748b">Princípios de design</text>

  <circle cx="48" cy="626" r="4" fill="#7c3aed"/>
